kind = "web"
previewPath = "/"
title = "sans admin version"
version = "1.0.0"
id = "artifacts/lexconc-ma"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21934

[services.development]
run = "pnpm --filter @workspace/lexconc-ma run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lexconc-ma", "run", "build" ]
publicDir = "artifacts/lexconc-ma/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21934"
BASE_PATH = "/"

[[services]]
name = "python-api"
paths = [ "/lexconc-api" ]
localPort = 8765

[services.development]
run = "python3 /home/runner/workspace/artifacts/lexconc-ma/backend/main.py"

[services.env]
PORT = "8765"
