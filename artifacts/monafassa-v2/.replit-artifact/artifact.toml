kind = "web"
  previewPath = "/monafassa-v2/"
  title = "Monafassa AI Chatbot v2"
  version = "1.0.0"
  id = "artifacts/monafassa-v2"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/monafassa-v2/" ]
  localPort = 3000

  [services.development]
  run = "pnpm --filter @workspace/monafassa-v2 run dev"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/monafassa-v2", "run", "build" ]
  publicDir = "artifacts/monafassa-v2/dist/public"
  serve = "static"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"

  [services.env]
  PORT = "3000"
  BASE_PATH = "/monafassa-v2/"
  