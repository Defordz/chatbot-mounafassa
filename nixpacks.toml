[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install -g pnpm && pnpm install --no-frozen-lockfile --ignore-scripts"]

[phases.build]
cmds = [
  "pnpm --filter @workspace/conseil-chatbot run build",
  "pnpm --filter @workspace/api-server run build"
]

[start]
cmd = "node artifacts/api-server/dist/index.mjs"