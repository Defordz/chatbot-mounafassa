<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chatbot IA Monafassa</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green-900:#0d2818;--green-800:#1b4332;--green-700:#2d6a4f;
  --green-600:#40916c;--green-500:#52b788;--green-400:#74c69d;
  --green-300:#95d5b2;--green-200:#b7e4c7;
  --bg-main:#f0f4f1;--bg-white:#ffffff;
  --text-900:#1a1a2e;--text-700:#2d2d44;--text-400:#6b7280;--text-300:#9ca3af;
  --border:rgba(45,106,79,0.08);
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.04);
  --shadow-md:0 4px 16px rgba(0,0,0,0.06);
  --font-body:'DM Sans',system-ui,sans-serif;
  --font-display:'Playfair Display',Georgia,serif;
  --sidebar-width:270px;
}
html,body{height:100%;overflow:hidden;font-family:var(--font-body);background:var(--bg-main);color:var(--text-900)}

.app-container{display:flex;height:100vh;width:100vw;overflow:hidden}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar-width);background-color:var(--green-900);
  background-image:url('https://i.imgur.com/placeholder.png');
  background-size:cover;background-position:center;
  display:flex;flex-direction:column;padding:28px 20px;flex-shrink:0;
  position:relative;overflow-x:hidden;overflow-y:auto;z-index:10;
  transition:width .3s ease,padding .3s ease,opacity .3s ease;
}
.sidebar::before{content:'';position:absolute;inset:0;background:rgba(0,40,20,0.7);pointer-events:none}
.sidebar::after{content:'';position:absolute;inset:0;opacity:.06;
  background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.8) 1px,transparent 1px);
  background-size:22px 22px;pointer-events:none}
.sidebar.collapsed{width:0;padding:0;overflow:hidden;opacity:0;pointer-events:none}

.sidebar-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:8px;position:relative;z-index:1}
.sidebar-logo-img{background:white;border-radius:10px;padding:6px 10px;width:100%}
.sidebar-logo-text h1{color:white;font-size:15px;font-weight:700;letter-spacing:-0.01em;line-height:1.2;font-family:var(--font-body);text-align:center}
.sidebar-logo-text span{color:rgba(255,255,255,.4);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:3px;display:block;text-align:center}

.sidebar-toggle{
  align-self:center;z-index:3;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.6);cursor:pointer;padding:6px 14px;border-radius:var(--radius-sm);
  transition:all .2s;display:flex;align-items:center;justify-content:center;margin-bottom:6px;position:relative;
}
.sidebar-toggle:hover{color:rgba(255,255,255,.95);background:rgba(0,0,0,.35)}
.sidebar-toggle svg{width:18px;height:18px}

.sidebar-expand{
  display:flex;align-items:center;justify-content:center;background:none;
  border:1px solid var(--border);color:var(--green-700);cursor:pointer;padding:6px;
  border-radius:var(--radius-sm);margin-right:8px;transition:all .2s;
}
.sidebar-expand:hover{background:rgba(45,106,79,.08);color:var(--green-800)}
.sidebar-expand svg{width:20px;height:20px}

.sidebar-divider{height:1px;background:rgba(255,255,255,.07);margin:20px 0;position:relative;z-index:1}

.btn-new-chat{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-md);
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
  color:rgba(255,255,255,.8);font-size:13px;font-weight:600;cursor:pointer;
  transition:all .25s;position:relative;z-index:1;width:100%;
}
.btn-new-chat:hover{background:rgba(255,255,255,.12);color:white;border-color:rgba(255,255,255,.15)}

.sidebar-section-title{
  font-size:10px;font-weight:700;color:rgba(255,255,255,.3);text-transform:uppercase;
  letter-spacing:.1em;padding:16px 4px 8px;position:relative;z-index:1;
}

.sidebar-history{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;z-index:1;margin-top:6px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.sidebar-history::-webkit-scrollbar{width:3px}
.sidebar-history::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:10px}

.conv-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;position:relative;z-index:1;margin-bottom:2px}
.conv-item:hover{background:rgba(255,255,255,.06)}
.conv-item.active{background:rgba(255,255,255,.1);border-left:2px solid var(--green-500);padding-left:8px}
.conv-icon{flex-shrink:0;color:rgba(255,255,255,.35);width:14px;height:14px}
.conv-item.active .conv-icon{color:var(--green-400)}
.conv-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:500;color:rgba(255,255,255,.6);line-height:1.3}
.conv-item.active .conv-title{color:rgba(255,255,255,.9)}
.conv-delete{flex-shrink:0;display:none;align-items:center;justify-content:center;border:none;background:none;color:rgba(255,255,255,.25);cursor:pointer;padding:3px;border-radius:4px;transition:all .15s}
.conv-item:hover .conv-delete{display:flex}
.conv-delete:hover{color:#e74c3c;background:rgba(231,76,60,.15)}
.conv-delete svg{width:13px;height:13px}

.sidebar-footer{margin-top:auto;position:relative;z-index:1;flex-shrink:0}
.sidebar-credit{color:rgba(255,255,255,.25);font-size:10px;text-align:center;line-height:1.5;position:relative;z-index:1}

/* MAIN AREA */
.main-area{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-main);position:relative}

.main-header{
  height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;
  background:rgba(255,255,255,.65);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);flex-shrink:0;z-index:5;
}
.header-left{display:flex;align-items:center;gap:12px}
.header-avatar{width:36px;height:36px;border-radius:var(--radius-md);background:linear-gradient(135deg,var(--green-600),var(--green-700));display:flex;align-items:center;justify-content:center;color:white}
.header-title{font-size:15px;font-weight:700;color:var(--text-900)}
.header-subtitle{font-size:12px;color:var(--green-600);font-weight:500}
.header-badge{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;color:var(--green-700);background:rgba(82,183,136,.08);border:1px solid rgba(82,183,136,.15)}

/* CHAT MESSAGES */
.chat-messages{flex:1;overflow-y:auto;padding:28px 32px;scroll-behavior:smooth}
.chat-inner{max-width:800px;margin:0 auto;width:100%}

.welcome-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:48px;text-align:center}
.welcome-logo{height:80px;margin-bottom:20px}
.welcome-title{font-family:var(--font-display);font-size:32px;color:var(--text-900);margin-bottom:12px;font-weight:700}
.welcome-desc{font-size:15px;color:var(--text-400);max-width:520px;line-height:1.6;margin-bottom:36px}

.suggestions-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:600px}
.suggestion-card{
  background:var(--bg-white);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:18px 20px;text-align:left;cursor:pointer;transition:all .25s;
}
.suggestion-card:hover{border-color:var(--green-300);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.suggestion-icon{font-size:24px;margin-bottom:10px;display:block}
.suggestion-label{font-size:13px;font-weight:700;color:var(--text-900);margin-bottom:4px}
.suggestion-text{font-size:12px;color:var(--text-400);line-height:1.4}

.welcome-disclaimer{text-align:center;margin-top:24px;font-size:10px;color:#999;letter-spacing:.01em;line-height:1.6;padding:0 16px;max-width:700px;margin-left:auto;margin-right:auto;font-style:italic}

/* MESSAGE BUBBLES */
.msg-row{display:flex;gap:12px;margin-bottom:20px;animation:fadeInUp .35s ease both}
.msg-row.user{flex-direction:row-reverse}
.msg-avatar{width:32px;height:32px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.msg-row:not(.user) .msg-avatar{background:linear-gradient(135deg,var(--green-600),var(--green-700));color:white}
.msg-row.user .msg-avatar{background:linear-gradient(135deg,#6366f1,#818cf8);color:white}
.msg-wrapper{max-width:78%}
.msg-bubble{padding:14px 18px;border-radius:var(--radius-lg);font-size:14px;line-height:1.65;word-wrap:break-word}
.msg-row:not(.user) .msg-bubble{background:var(--bg-white);color:var(--text-700);border:1px solid var(--border);border-top-left-radius:4px}
.msg-row.user .msg-bubble{background:linear-gradient(135deg,var(--green-700),var(--green-600));color:white;border-top-right-radius:4px}
.msg-time{font-size:10px;color:var(--text-300);margin-top:6px;padding:0 4px}
.msg-row.user .msg-time{text-align:right}
.msg-sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.source-tag{font-size:10px;padding:3px 8px;border-radius:20px;background:rgba(82,183,136,.08);color:var(--green-700);border:1px solid rgba(82,183,136,.12);font-weight:600}
.msg-error .msg-bubble{background:#fef2f2 !important;color:#dc2626 !important;border-color:#fecaca !important}

/* TYPING */
.typing-row{display:flex;gap:12px;margin-bottom:20px}
.typing-bubble{background:var(--bg-white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 18px;border-top-left-radius:4px}
.typing-label{font-size:12px;color:var(--text-400);margin-bottom:8px;font-style:italic}
.typing-dots{display:flex;gap:5px}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--green-400);animation:typingBounce 1.4s ease infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}

/* INPUT AREA */
.input-area{padding:12px 32px 8px;background:var(--bg-main);flex-shrink:0;position:sticky;bottom:0;z-index:5}
.input-inner{max-width:800px;margin:0 auto;width:100%}
.input-box{
  display:flex;align-items:flex-end;gap:8px;background:var(--bg-white);
  border-radius:var(--radius-lg);border:1.5px solid rgba(45,106,79,.1);
  padding:6px 6px 6px 20px;box-shadow:var(--shadow-sm);transition:all .25s;
}
.input-box:focus-within{border-color:var(--green-400);box-shadow:0 0 0 3px rgba(82,183,136,.1)}
.input-box textarea{
  flex:1;border:none;outline:none;resize:none;font-size:14px;font-family:var(--font-body);
  color:var(--text-900);background:transparent;line-height:1.5;max-height:130px;min-height:24px;padding:8px 0;
}
.input-box textarea::placeholder{color:var(--text-300)}
.btn-send,.btn-mic{
  width:40px;height:40px;border-radius:var(--radius-md);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;
}
.btn-send.active{background:linear-gradient(135deg,var(--green-600),var(--green-700));color:white}
.btn-send.active:hover{transform:scale(1.05)}
.btn-send.inactive{background:rgba(45,106,79,.06);color:rgba(45,106,79,.2);cursor:default}
.btn-mic{background:rgba(45,106,79,.06);color:var(--green-700)}
.btn-mic:hover{background:rgba(45,106,79,.12)}
.btn-mic.listening{background:#e74c3c;color:white;animation:pulse 1.5s ease infinite}

/* ANIMATIONS */
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,.3)}50%{box-shadow:0 0 0 8px rgba(231,76,60,0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{display:none}
  .chat-messages{padding:20px 16px}
  .main-header{padding:0 16px}
  .input-area{padding:8px 12px 8px}
  .welcome-disclaimer{font-size:9px;margin-top:16px;padding:0 8px}
  .suggestions-grid{grid-template-columns:1fr}
  .welcome-screen{padding-top:32px}
  .input-box textarea{font-size:16px}
}
@media(max-width:480px){
  .input-area{padding:6px 8px 6px}
  .input-box{padding:4px 4px 4px 14px;gap:4px}
  .btn-mic,.btn-send{width:38px;height:38px}
  .input-box textarea{font-size:16px}
  .welcome-disclaimer{font-size:8.5px;margin-top:14px;padding:0 4px}
  .welcome-title{font-size:24px}
  .welcome-desc{font-size:13px}
  .header-badge{display:none}
}
@media(max-height:500px){
  .main-header{height:50px}
  .chat-messages{padding:12px 16px}
  .input-area{padding:6px 16px 6px}
  .welcome-disclaimer{font-size:8px;margin-top:10px;line-height:1.4}
  .welcome-screen{padding-top:16px}
  .welcome-logo{height:48px}
  .welcome-title{font-size:22px}
  .suggestions-grid{gap:8px}
  .suggestion-card{padding:12px 14px}
}
@media(orientation:landscape) and (max-height:500px){
  .sidebar{display:none}
  .welcome-screen{padding-top:8px}
  .welcome-logo{height:40px;margin-bottom:10px}
  .welcome-desc{margin-bottom:10px}
  .welcome-disclaimer{font-size:7.5px;margin-top:8px}
}
</style>
</head>
<body>

<div class="app-container" id="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="https://www.conseil-concurrence.ma/assets/img/logo.png" alt="Conseil de la Concurrence" class="sidebar-logo-img" onerror="this.style.display='none'">
      <div class="sidebar-logo-text">
        <h1>Chatbot IA Monafassa</h1>
        <span>Assistant juridique IA</span>
      </div>
    </div>

    <button class="sidebar-toggle" onclick="toggleSidebar()" title="Réduire la barre latérale">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><polyline points="15 9 12 12 15 15"/></svg>
    </button>

    <div class="sidebar-divider"></div>

    <button class="btn-new-chat" onclick="newConversation()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nouvelle conversation
    </button>

    <div class="sidebar-history" id="sidebar-history"></div>

    <div class="sidebar-footer">
      <div class="sidebar-divider"></div>
      <div class="sidebar-credit">Conseil de la Concurrence<br>du Royaume du Maroc</div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-area">
    <header class="main-header">
      <div class="header-left">
        <button class="sidebar-expand" id="btn-expand" style="display:none" onclick="toggleSidebar()" title="Afficher la barre latérale">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><polyline points="13 9 16 12 13 15"/></svg>
        </button>
        <div class="header-avatar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="3"/><circle cx="9" cy="14" r="1.5" fill="currentColor"/><circle cx="15" cy="14" r="1.5" fill="currentColor"/><path d="M12 2v6"/><circle cx="12" cy="2" r="1" fill="currentColor"/></svg>
        </div>
        <div>
          <div class="header-title" id="header-title">Chatbot IA Monafassa</div>
          <div class="header-subtitle">Assistant juridique · Droit de la concurrence</div>
        </div>
      </div>
      <div class="header-badge" id="header-badge">0 questions</div>
    </header>

    <div class="chat-messages" id="chat-messages">
      <div class="chat-inner" id="chat-inner"></div>
    </div>

    <div class="input-area">
      <div class="input-inner">
        <div class="input-box">
          <textarea id="input" rows="1" placeholder="Posez votre question en droit de la concurrence marocain..." oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
          <button class="btn-send inactive" id="btn-send" onclick="sendMessage()" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
var SVG_BOT = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="3"/><circle cx="9" cy="14" r="1.5" fill="currentColor"/><circle cx="15" cy="14" r="1.5" fill="currentColor"/><path d="M12 2v6"/><circle cx="12" cy="2" r="1" fill="currentColor"/></svg>';
var SVG_USER = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
var SVG_MSG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
var SVG_TRASH = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';

var SUGGESTIONS = [
  {icon:"⚖️",label:"Concentrations",text:"Qu'est-ce qu'une opération de concentration économique ?"},
  {icon:"📊",label:"Seuils",text:"Quels sont les seuils de notification obligatoire ?"},
  {icon:"🔄",label:"Procédures",text:"Comment se déroule la procédure Phase I et Phase II ?"},
  {icon:"🛡️",label:"Pratiques",text:"Quelles sont les pratiques anticoncurrentielles prohibées ?"}
];

var conversations = [];
var activeId = null;
var sidebarOpen = true;
var isLoading = false;
var msgCounter = Date.now();

function init() {
  try {
    var raw = localStorage.getItem('lexconc-conversations');
    if (raw) conversations = JSON.parse(raw);
    activeId = localStorage.getItem('lexconc-active-conv') || null;
  } catch(e) {}
  render();
  renderSidebar();
}

function save() {
  try {
    localStorage.setItem('lexconc-conversations', JSON.stringify(conversations));
    if (activeId) localStorage.setItem('lexconc-active-conv', activeId);
    else localStorage.removeItem('lexconc-active-conv');
  } catch(e) {}
}

function getActive() {
  return conversations.find(function(c) { return c.id === activeId; }) || null;
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function genTitle(msg) { var t = msg.replace(/\s+/g,' ').trim(); return t.length <= 45 ? t : t.slice(0,42) + '...'; }

function getDateGroup(ts) {
  var now = new Date(), d = new Date(ts);
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if (ts >= today) return 'today';
  if (ts >= today - 86400000) return 'yesterday';
  if (ts >= today - now.getDay() * 86400000) return 'thisWeek';
  if (ts >= new Date(now.getFullYear(), now.getMonth(), 1).getTime()) return 'thisMonth';
  return 'older';
}

var GROUP_LABELS = {today:"Aujourd'hui",yesterday:"Hier",thisWeek:"Cette semaine",thisMonth:"Ce mois",older:"Plus ancien"};
var GROUP_ORDER = ['today','yesterday','thisWeek','thisMonth','older'];

function formatTime(ts) {
  var d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function escapeHtml(text) {
  var d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function simpleMarkdown(text) {
  var html = escapeHtml(text);
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/^### (.+)$/gm, '<h4 style="margin:12px 0 6px;font-size:14px;color:var(--green-800)">$1</h4>');
  html = html.replace(/^## (.+)$/gm, '<h3 style="margin:14px 0 8px;font-size:15px;color:var(--green-800)">$1</h3>');
  html = html.replace(/^# (.+)$/gm, '<h2 style="margin:16px 0 10px;font-size:16px;color:var(--green-800)">$1</h2>');
  html = html.replace(/^- (.+)$/gm, '<li style="margin-left:16px;margin-bottom:4px">$1</li>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function renderSidebar() {
  var el = document.getElementById('sidebar-history');
  var sorted = conversations.slice().sort(function(a,b) { return b.updatedAt - a.updatedAt; });
  var groups = {};
  GROUP_ORDER.forEach(function(g) { groups[g] = []; });
  sorted.forEach(function(c) { groups[getDateGroup(c.updatedAt)].push(c); });

  var html = '';
  GROUP_ORDER.forEach(function(g) {
    if (groups[g].length === 0) return;
    html += '<div class="sidebar-section-title">' + GROUP_LABELS[g] + '</div>';
    groups[g].forEach(function(c) {
      var cls = c.id === activeId ? ' active' : '';
      html += '<div class="conv-item' + cls + '" onclick="switchConv(\'' + c.id + '\')">'
        + '<span class="conv-icon">' + SVG_MSG + '</span>'
        + '<span class="conv-title">' + escapeHtml(c.title) + '</span>'
        + '<button class="conv-delete" onclick="event.stopPropagation();deleteConv(\'' + c.id + '\')" title="Supprimer">' + SVG_TRASH + '</button>'
        + '</div>';
    });
  });
  el.innerHTML = html;
}

function render() {
  var conv = getActive();
  var msgs = conv ? conv.messages : [];
  var qCount = msgs.filter(function(m) { return m.role === 'user'; }).length;
  document.getElementById('header-badge').textContent = qCount + ' question' + (qCount !== 1 ? 's' : '');
  document.getElementById('header-title').textContent = conv ? conv.title : 'Chatbot IA Monafassa';

  var inner = document.getElementById('chat-inner');

  if (msgs.length === 0) {
    var html = '<div class="welcome-screen">'
      + '<img src="https://www.conseil-concurrence.ma/assets/img/logo.png" class="welcome-logo" onerror="this.style.display=\'none\'">'
      + '<h2 class="welcome-title">Chatbot IA Monafassa</h2>'
      + '<p class="welcome-desc">Assistant juridique intelligent spécialisé en droit marocain de la concurrence, basé sur les textes officiels du Conseil de la Concurrence.</p>'
      + '<div class="suggestions-grid">';
    SUGGESTIONS.forEach(function(s,i) {
      html += '<button class="suggestion-card" onclick="sendMessage(\'' + s.text.replace(/'/g,"\\'") + '\')" style="animation:fadeInUp .4s ease ' + (0.1+i*0.07) + 's both">'
        + '<span class="suggestion-icon">' + s.icon + '</span>'
        + '<div class="suggestion-label">' + s.label + '</div>'
        + '<div class="suggestion-text">' + s.text + '</div></button>';
    });
    html += '</div>'
      + '<div class="welcome-disclaimer">Les informations délivrées par le Chatbot IA Monafassa sont fournies à titre indicatif et ne peuvent être assimilées à une prise de position officielle du Conseil de la concurrence, ni engager sa responsabilité. Le Conseil de la concurrence se réserve le droit d\'apprécier souverainement toute situation au regard des dispositions légales et réglementaires en vigueur.</div>'
      + '</div>';
    inner.innerHTML = html;
  } else {
    var html = '';
    msgs.forEach(function(m) {
      var isUser = m.role === 'user';
      var errClass = m.isError ? ' msg-error' : '';
      html += '<div class="msg-row' + (isUser ? ' user' : '') + errClass + '" style="animation:fadeInUp .35s ease both">'
        + '<div class="msg-avatar">' + (isUser ? SVG_USER : SVG_BOT) + '</div>'
        + '<div class="msg-wrapper">'
        + '<div class="msg-bubble">' + (isUser ? escapeHtml(m.content) : simpleMarkdown(m.content)) + '</div>';
      if (m.sources && m.sources.length > 0) {
        html += '<div class="msg-sources">';
        m.sources.forEach(function(s) {
          html += '<span class="source-tag">📄 ' + escapeHtml(s) + '</span>';
        });
        html += '</div>';
      }
      html += '<div class="msg-time">' + formatTime(m.timestamp) + '</div>'
        + '</div></div>';
    });
    if (isLoading) {
      html += '<div class="typing-row"><div class="msg-avatar">' + SVG_BOT + '</div>'
        + '<div class="typing-bubble"><div class="typing-label">Recherche dans la base documentaire...</div>'
        + '<div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>'
        + '</div></div>';
    }
    html += '<div id="messages-end"></div>';
    inner.innerHTML = html;
    var end = document.getElementById('messages-end');
    if (end) end.scrollIntoView({behavior:'smooth'});
  }
}

function sendMessage(text) {
  var q = text || document.getElementById('input').value.trim();
  if (!q || isLoading) return;

  var userMsg = {id:String(++msgCounter),role:'user',content:q,timestamp:Date.now()};

  if (!activeId) {
    var conv = {id:genId(),title:genTitle(q),messages:[userMsg],createdAt:Date.now(),updatedAt:Date.now()};
    activeId = conv.id;
    conversations.unshift(conv);
  } else {
    var conv = getActive();
    conv.messages.push(userMsg);
    conv.updatedAt = Date.now();
  }

  document.getElementById('input').value = '';
  document.getElementById('input').style.height = 'auto';
  updateSendBtn();
  isLoading = true;
  save();
  render();
  renderSidebar();

  var conv = getActive();
  var history = conv.messages.slice(-10).map(function(m) { return {role:m.role,content:m.content}; });

  google.script.run
    .withSuccessHandler(function(res) {
      isLoading = false;
      var c = getActive();
      if (!c) return;
      if (res.success) {
        c.messages.push({id:String(++msgCounter),role:'assistant',content:res.answer,sources:res.sources||[],timestamp:Date.now()});
      } else {
        c.messages.push({id:String(++msgCounter),role:'assistant',content:'Erreur : ' + (res.error||'Service indisponible'),timestamp:Date.now(),isError:true});
      }
      c.updatedAt = Date.now();
      save();
      render();
      renderSidebar();
    })
    .withFailureHandler(function(err) {
      isLoading = false;
      var c = getActive();
      if (c) {
        c.messages.push({id:String(++msgCounter),role:'assistant',content:'Erreur de connexion au service.',timestamp:Date.now(),isError:true});
        c.updatedAt = Date.now();
        save();
      }
      render();
      renderSidebar();
    })
    .chat(q, history);
}

function newConversation() { activeId = null; save(); render(); renderSidebar(); }
function switchConv(id) { activeId = id; save(); render(); renderSidebar(); }
function deleteConv(id) {
  conversations = conversations.filter(function(c) { return c.id !== id; });
  if (activeId === id) activeId = null;
  save(); render(); renderSidebar();
}

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  var sb = document.getElementById('sidebar');
  var btn = document.getElementById('btn-expand');
  if (sidebarOpen) { sb.classList.remove('collapsed'); btn.style.display = 'none'; }
  else { sb.classList.add('collapsed'); btn.style.display = 'flex'; }
}

function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 130) + 'px'; updateSendBtn(); }
function updateSendBtn() {
  var btn = document.getElementById('btn-send');
  var val = document.getElementById('input').value.trim();
  btn.disabled = !val;
  btn.className = 'btn-send ' + (val ? 'active' : 'inactive');
}

document.getElementById('input').addEventListener('input', function() { updateSendBtn(); });

init();
</script>
</body>
</html>
